<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garab Stock Pharmacie</title>
<meta name="description" content="Démo de Garab : gestion de stock pour les pharmacies. Alertes de péremption, caisse, suggestions de commande, inventaire. En français, payé en Mobile Money.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Mise en page : logiciel de gestion — barre latérale (rôle + navigation) + zone de travail ; sur téléphone, onglets défilants en haut */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunk:#E6ECE9; --line:#D3DCD8;
  --fg:#13201B; --muted:#56675F;
  --ink:#0A6B4B; --ink-fg:#FFFFFF; --acc:#C98A00; --acc-soft:#FBF0D6;
  --ok:#1E7A46; --ok-soft:#DFF3E6; --warn:#A35C00; --warn-soft:#FCEBD3; --bad:#B3261E; --bad-soft:#FBE1DE;
  --wa:#DCF8C6; --wa-fg:#111B21; --wa-bg:#EFE7DD;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16211D; --sunk:#1E2B26; --line:#2C3C36;
  --fg:#E5EEEA; --muted:#98ACA4;
  --ink:#5CC99F; --ink-fg:#05201A; --acc:#F0B93A; --acc-soft:#3A2E10;
  --ok:#5BD18C; --ok-soft:#173826; --warn:#F2A54A; --warn-soft:#3B2810; --bad:#FF8A80; --bad-soft:#40201D;
  --wa:#005C4B; --wa-fg:#E9EDEF; --wa-bg:#0B141A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16211D; --sunk:#1E2B26; --line:#2C3C36;
  --fg:#E5EEEA; --muted:#98ACA4;
  --ink:#5CC99F; --ink-fg:#05201A; --acc:#F0B93A; --acc-soft:#3A2E10;
  --ok:#5BD18C; --ok-soft:#173826; --warn:#F2A54A; --warn-soft:#3B2810; --bad:#FF8A80; --bad-soft:#40201D;
  --wa:#005C4B; --wa-fg:#E9EDEF; --wa-bg:#0B141A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--ink);color:var(--ink-fg);padding:20px 12px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:-.02em;line-height:1}
.brand small{display:block;opacity:.78;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.role{display:flex;flex-direction:column;gap:4px;padding:0 8px}
.role label{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.role select{background:color-mix(in srgb,var(--ink-fg) 14%,transparent);color:var(--ink-fg);border:1px solid color-mix(in srgb,var(--ink-fg) 30%,transparent);border-radius:8px;padding:7px 8px}
.role select option{color:#13201B;background:#fff}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.95rem}
.nav button:hover{background:color-mix(in srgb,var(--ink-fg) 12%,transparent)}
.nav button[aria-current="page"]{background:var(--ink-fg);color:var(--ink);font-weight:700}
.nav button:focus-visible{outline:3px solid var(--acc)}
.nav .pill{font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--acc);color:#2A1D00;font-weight:700}
.side .foot{margin-top:auto;font-size:.78rem;opacity:.82;padding:0 8px}
main{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1240px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.top p{margin-top:2px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:700;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.wa{background:#1FA855;color:#fff;border-color:#1FA855}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left}
button.kpi{cursor:pointer;font:inherit;color:inherit}
button.kpi:hover{border-color:var(--ink)}
.kpi span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-size:1.45rem}
.kpi em{font-style:normal;font-size:.82rem;color:var(--muted)}
.kpi.alert{border-color:var(--bad);background:var(--bad-soft)}
.kpi.alert b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel header p{color:var(--muted);font-size:.85rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--sunk);vertical-align:middle}
td small{display:block;color:var(--muted);font-size:.8rem}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.st{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)} .st.bad{background:var(--bad-soft);color:var(--bad)} .st.n{background:var(--sunk);color:var(--muted)} .st.acc{background:var(--acc-soft);color:var(--warn)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--sunk)}
.li:last-child{border-bottom:0}
.li small{display:block;color:var(--muted);font-size:.8rem}
.li .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.ic.bad{background:var(--bad-soft);color:var(--bad)} .ic.warn{background:var(--warn-soft);color:var(--warn)} .ic.ok{background:var(--ok-soft);color:var(--ok)}
.li .grow{flex:1;min-width:0}
.smart{border:1px dashed var(--acc);background:var(--acc-soft)}
.note-box{background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:.88rem;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid var(--line);padding-top:8px}
.bars div{flex:1;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bars div:hover{opacity:1}
.bars div.today{background:var(--acc)}
.axis{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;min-width:0}
.field label,.lbl{color:var(--muted);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.search{width:100%;font-size:1rem;padding:11px 12px}
.qin{width:74px;text-align:right;padding:5px 6px;font-family:var(--mono)}
.lotin{width:110px;padding:5px 6px;font-family:var(--mono)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:.84rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg)}
.seg button:focus-visible{outline:3px solid var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:.84rem;font-weight:700}
.chip:hover{border-color:var(--ink)}
.ticket{display:flex;flex-direction:column;gap:10px}
.tl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--sunk)}
.tl small{display:block;color:var(--muted);font-size:.78rem}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{all:unset;cursor:pointer;width:28px;height:28px;display:grid;place-items:center;font-weight:700}
.qty button:hover{background:var(--sunk)}
.qty button:focus-visible{outline:3px solid var(--acc)}
.qty span{min-width:26px;text-align:center}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:1.05rem;padding-top:4px}
.total b{font-size:1.6rem}
.methods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.methods button{cursor:pointer;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;font-weight:700;font-size:.85rem}
.methods button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk)}
.wa-wrap{background:var(--wa-bg);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.bubble{background:var(--wa);color:var(--wa-fg);padding:8px 10px 6px;border-radius:8px 0 8px 8px;max-width:94%;align-self:flex-end;font-size:.88rem;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.12)}
.bubble.in{align-self:flex-start;border-radius:0 8px 8px 8px;background:var(--surface);color:var(--fg)}
.bubble .t{display:block;text-align:right;font-size:.68rem;opacity:.7;margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(8,20,16,.5);display:flex;justify-content:flex-end;z-index:30}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.drawer{background:var(--bg);width:min(580px,100%);height:100%;overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 20px;display:flex;flex-direction:column;gap:14px}
.modal{background:var(--bg);width:min(680px,100%);max-height:92vh;overflow-y:auto;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .top,.drawer .top{flex-wrap:nowrap;align-items:flex-start}
.x{all:unset;cursor:pointer;font-size:1.4rem;line-height:1;padding:4px 8px;border-radius:6px}
.x:focus-visible{outline:3px solid var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.plan{border:2px solid var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.plan .price{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.demo-band{background:var(--acc-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.84rem;font-weight:700}
.reader{width:100%;max-width:440px;aspect-ratio:4/3;background:#0b1210;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:#cfe;position:relative;margin-inline:auto}
.reader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reader .aim{position:absolute;left:50%;top:50%;width:56%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none;transition:border-color .15s}
.reader .aim.hit{border-color:#5BD18C}
.reader .tip{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:.8rem;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.reader .ph{padding:20px;text-align:center;font-size:.9rem;opacity:.85}
#scanres,#ticket{scroll-margin-top:80px}
.scanok{border:2px solid var(--ok)} .scanwarn{border:2px solid var(--warn)} .scanbad{border:2px solid var(--bad)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.raw{font-family:var(--mono);font-size:.75rem;background:var(--sunk);padding:6px 8px;border-radius:6px;word-break:break-all;color:var(--muted)}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.lot{font-family:var(--mono);font-size:.82rem}
.nav button .ico{display:inline-flex;align-items:center;gap:10px}
.nav svg,.tabbar svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar,.cartbar,.mrole{display:none}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.plan.cur{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 25%,transparent)}
.plan.alt{border:1px solid var(--line)}
.plan .tagp{align-self:flex-start;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 9px;border-radius:99px;background:var(--acc);color:#2A1D00}
.plan .sub{color:var(--muted);font-size:.86rem}
.plan .inst{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:.86rem}
.plan .inst s{color:var(--muted)}
.plan .grow{flex:1}
.launch{background:var(--ink);color:var(--ink-fg);border-radius:var(--r);padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.launch b{font-family:var(--display);font-size:1.05rem}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;counter-increment:st}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-weight:700;display:grid;place-items:center}
.steps small{display:block;color:var(--muted)}
.recap{display:flex;flex-direction:column}
.recap div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--sunk)}
.recap div.t{border-bottom:0;font-weight:700;font-size:1.1rem}
.sheet{background:var(--bg);width:100%;max-height:80vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-self:flex-end}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 6px}
.sheet button.it{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 10px;border-radius:10px;font-size:1.02rem;font-weight:700}
.sheet button.it:hover,.sheet button.it[aria-current="page"]{background:var(--sunk)}
.sheet button.it .pill{margin-left:auto;font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--acc);color:#2A1D00}
.sheet svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:980px){.plans{grid-template-columns:minmax(0,1fr)}}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid2.eq{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  body{font-size:16px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:10px;z-index:20;overflow:visible}
  .brand{padding:0;gap:8px} .brand b{font-size:1.25rem} .brand small{display:none} .brand svg{width:26px;height:26px}
  .role,.nav,.side .foot{display:none}
  .mrole{display:block;background:color-mix(in srgb,var(--ink-fg) 16%,transparent);color:var(--ink-fg);border:1px solid color-mix(in srgb,var(--ink-fg) 30%,transparent);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:700;max-width:58%}
  .mrole option{color:#13201B;background:#fff}
  main{padding-top:16px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:16px}
  h1{font-size:1.45rem} .top p{font-size:.9rem}
  .tabbar{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:.7rem;font-weight:700;color:var(--muted);position:relative;min-height:44px;justify-content:center}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button:focus-visible{outline:3px solid var(--acc)}
  .tabbar svg{width:24px;height:24px}
  .tabbar .scan{color:var(--ink-fg)}
  .tabbar .scan span.b{width:54px;height:54px;margin-top:-26px;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);border:4px solid var(--surface)}
  .tabbar .scan svg{width:26px;height:26px}
  .tabbar .scan small{color:var(--muted);font-size:.7rem}
  .tabbar .scan[aria-current="page"] small{color:var(--ink)}
  .tabbar .dot{position:absolute;top:2px;left:calc(50% + 6px);font-size:.66rem;min-width:18px;padding:0 5px;border-radius:99px;background:var(--acc);color:#2A1D00;text-align:center;line-height:18px}
  .cartbar{display:flex;position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:24;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .cartbar b{font-size:1.1rem}

  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .btn{min-height:44px;padding:10px 16px} .btn.sm{min-height:38px;padding:7px 12px}
  .chip{padding:9px 13px}
  .seg button{padding:10px 12px}
  .qty button{width:38px;height:38px}
  input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],select,textarea{font-size:16px;min-height:44px}

function gsChk(b){let s=0;for(let i=0;i<b.length;i++)s+=(+b[b.length-1-i])*(i%2?1:3);return(10-s%10)%10}

S.scanMode="entree";S.scans=[];S.serials=new Set();S.cur=null;S.cam=null;
function gs1(raw){let s=String(raw).trim().replace(/^\](d2|C1|Q3|e0)/,"").replace(/^\x1D/,"");
  if(s.startsWith("(")){const o={};s.replace(/\((\d{2,4})\)([^(]*)/g,(m,a,v)=>{o[a]=v.trim()});return Object.keys(o).length?o:null}
  if(!/^(00|01|02|10|11|17|21)\d/.test(s))return null;
  const FIX={"00":18,"01":14,"02":14,"11":6,"12":6,"13":6,"15":6,"16":6,"17":6,"20":2},o={};let i=0;
  while(i<s.length){const a2=s.substr(i,2);
    if(FIX[a2]){o[a2]=s.substr(i+2,FIX[a2]);i+=2+FIX[a2];continue}
    let ai=["240","241","710","711","712","713","714"].find(a=>s.startsWith(a,i))||(["10","21","22"].includes(a2)?a2:null);
    if(!ai)break;const st=i+ai.length;let e=s.indexOf("\x1D",st);if(e<0)e=s.length;o[ai]=s.slice(st,e);i=e+1}
  return o["01"]||o["17"]||o["10"]?o:null}
function gsDate(v){if(!/^\d{6}$/.test(v||""))return"";const y=2000+ +v.slice(0,2),m=+v.slice(2,4);let d=+v.slice(4,6);if(!d)d=new Date(y,m,0).getDate();
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function lire(raw,fmt){const r={raw,fmt:fmt||"",gtin:"",lot:"",exp:"",serie:""},g=gs1(raw);
  if(g){r.kind="DataMatrix GS1";r.gtin=g["01"]||"";r.lot=g["10"]||"";r.exp=gsDate(g["17"]);r.serie=g["21"]||""}
  else if(/^\d{8}$|^\d{12,14}$/.test(raw)){r.kind="Code-barres";r.gtin=raw.padStart(14,"0")}
  else r.kind="Autre code";
  r.p=findGtin(r.gtin);r.dup=!!(r.serie&&S.serials.has(r.gtin+"|"+r.serie));return r}

  if(r.kind==="Code-barres")msgs.push(["warn","Code-barres simple : il donne le produit, mais pas le lot ni la date. Saisissez-les ci-dessous."]);
  if(r.kind==="DataMatrix GS1"&&(!r.lot||!r.exp))msgs.push(["warn","Ce DataMatrix ne contient pas "+(!r.lot&&!r.exp?"le lot ni la date":!r.lot?"le n° de lot":"la date")+" : complétez à la main."]);

  V_scanRes();const rs=document.getElementById("scanres");if(rs&&window.innerWidth<980&&!(S.scanMode==="vente"&&r.done))rs.scrollIntoView({behavior:"smooth",block:"start"})}
function logScan(r,st,c,txt){if(r.serie)S.serials.add(r.gtin+"|"+r.serie);S.scans.push({nom:(r.p||{}).nom||"Produit",st,c,txt:(r.lot?"lot "+r.lot:"")+(r.exp?" · exp. "+dfr(r.exp):"")+(txt?" · "+txt:"")});V_scanList()}
/* Lecteur : BarcodeDetector natif s'il lit le DataMatrix (Android), sinon ZXing-C++ en WebAssembly (iPhone, ordinateur) */
let DET=null;
async function detector(){if(DET)return DET;
  if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes("data_matrix")){DET=new BarcodeDetector({formats:FORMATS.filter(x=>f.includes(x))});return DET}}catch(e){}}
  if(!window.BarcodeDetectionAPI)await new Promise((ok,ko)=>{const s=document.createElement("script");s.src=LIB;s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
  const A=window.BarcodeDetectionAPI;A.setZXingModuleOverrides({locateFile:(f,pre)=>f.endsWith(".wasm")?WASM+f:pre+f});
  DET=new A.BarcodeDetector({formats:FORMATS});return DET}
const fmtName=f=>({data_matrix:"DataMatrix",qr_code:"QR code",ean_13:"EAN-13",ean_8:"EAN-8",code_128:"Code 128"}[f]||f||"");
async function camOn(){const st=document.getElementById("camst"),el=document.getElementById("reader");st.textContent="Ouverture de la caméra…";
  try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("nocam");
    const [det,stream]=await Promise.all([detector(),navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}})]);
    if(S.view!=="scanner"){stream.getTracks().forEach(t=>t.stop());return}
    el.innerHTML='<video playsinline muted autoplay></video><div class="aim" id="aim"></div><div class="tip">Le carré DataMatrix dans le cadre, à 10–15 cm, bien net</div>';
    const v=el.querySelector("video");v.srcObject=stream;await v.play().catch(()=>{});
    const tr=stream.getVideoTracks()[0];try{await tr.applyConstraints({advanced:[{focusMode:"continuous"}]})}catch(e){}
    const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
    const cam={stream,v,paused:false,busy:false,n:0,timer:0};S.cam=cam;
    const tick=async()=>{if(S.cam!==cam)return;
      if(!cam.paused&&!cam.busy&&v.readyState>=2&&v.videoWidth){cam.busy=true;cam.n++;
        try{const W=v.videoWidth,H=v.videoHeight;let sx=0,sy=0,sw=W,sh=H;
          if(cam.n%2){const z=Math.round(Math.min(W,H)*.62);sx=(W-z)>>1;sy=(H-z)>>1;sw=sh=z}  // une image sur deux : le centre seulement
          cv.width=sw;cv.height=sh;cx.drawImage(v,sx,sy,sw,sh,0,0,sw,sh);
          const r=await det.detect(cv);if(r&&r.length&&S.cam===cam&&!cam.paused){const a=document.getElementById("aim");a&&a.classList.add("hit");setTimeout(()=>a&&a.classList.remove("hit"),600);onCode(r[0].rawValue,fmtName(r[0].format))}}
        catch(e){}cam.busy=false}
      cam.timer=setTimeout(tick,120)};
    tick();
    st.textContent="Visez le code : il est lu tout seul.";document.getElementById("camon").hidden=true;document.getElementById("camoff").hidden=false}
  catch(e){stopCam();const camErr=e&&(e.name==="NotAllowedError"||e.name==="NotFoundError"||e.name==="NotReadableError"||e.name==="SecurityError"||e.message==="nocam");
    if(el)el.innerHTML='<div class="ph">'+(camErr?"Touchez « Prendre une photo du code » ci-dessous,<br>puis photographiez le DataMatrix de près.":"Lecteur indisponible.")+'</div>';
    st.textContent=camErr?"La caméra en direct est bloquée sur cette page (c'est le cas dans claude.ai, ou si l'accès a été refusé). Utilisez « Prendre une photo du code ».":"Le lecteur n'a pas pu se charger (pas d'internet ?). Utilisez les boîtes d'exemple.";
    const pb=document.getElementById("photobtn");if(pb&&camErr){pb.classList.add("pri");document.getElementById("camon").classList.remove("pri")}}}
function stopCam(){const c=S.cam;S.cam=null;if(c){clearTimeout(c.timer);try{c.stream.getTracks().forEach(t=>t.stop())}catch(e){}}}
async function scanPhoto(file){const st=document.getElementById("camst");st.textContent="Lecture de la photo…";
  try{const det=await detector();let img;try{img=await createImageBitmap(file)}catch(e){img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(file)})}
    let r=await det.detect(img);
    if(!r.length){const W=img.width,H=img.height,z=Math.round(Math.min(W,H)*.6),cv=document.createElement("canvas");cv.width=cv.height=z;cv.getContext("2d").drawImage(img,(W-z)>>1,(H-z)>>1,z,z,0,0,z,z);r=await det.detect(cv)}
    if(!r.length){st.textContent="Aucun code lu sur cette photo. Rapprochez-vous (10–15 cm), avec une bonne lumière et le code bien net.";return}
    st.textContent="Code lu sur la photo.";onCode(r[0].rawValue,fmtName(r[0].format))}
  catch(e){st.textContent="Le lecteur n'a pas pu se charger (pas d'internet ?)."}}
function scanAdd(){const r=S.cur,pid=r.p?r.p.id:+(document.getElementById("sp")||{}).value,p=pid&&byId(pid);if(!p){toast("Choisissez d'abord le produit.");return}
  const lot=document.getElementById("slot").value.trim(),exp=document.getElementById("sexp").value,q=Math.max(1,parseInt(document.getElementById("sq2").value)||1);
  if(!lot||!exp){toast("Indiquez le n° de lot et la date de péremption.");return}
  if(dj(exp)<0){toast("Lot périmé : il ne peut pas entrer en stock.");return}
  let learned="";if(!r.p&&r.gtin&&!findGtin(r.gtin)){p.gtins.push(r.gtin);learned=" Code retenu pour ce produit."}
  const l=p.lots.find(x=>x.n===lot&&x.exp===exp);l?l.q+=q:p.lots.push({n:lot,exp,q,prio:false});r.p=p;
  logScan(r,"+"+q+" en stock","ok","");S.cur=null;nav();V_scanRes();resumeCam();toast(`${q} × ${p.nom} (lot ${lot}, exp. ${dfr(exp)}) ajouté au stock.${learned}`)}
function scanSell(){const r=S.cur,pid=r.p?r.p.id:+(document.getElementById("sp")||{}).value,p=pid&&byId(pid);if(!p){toast("Choisissez d'abord le produit.");return}
  if(!r.p&&r.gtin&&!findGtin(r.gtin))p.gtins.push(r.gtin);r.p=p;
  if(addCart(p.id,true)){logScan(r,"Vendu","ok","ajouté au ticket");toast(`${p.nom} ajouté au ticket.`);S.cur=null;V_scanRes();resumeCam()}}
function resumeCam(){if(S.cam)S.cam.paused=false}

/* ---------- Événements ---------- */
document.addEventListener("click",e=>{const t=e.target.closest("button,[data-prod],[data-close]");if(!t)return;const d=t.dataset;
  if(d.close&&(e.target===t)){closeLayer();return}
  if(d.go){if(d.tab)S.perTab=d.tab;if(d.mode)S.scanMode=d.mode;go(d.go);return}
  if(d.prod){fiche(d.prod);return}
  if(d.add){addCart(d.add);return}
  if(d.q){const[pid,s]=d.q.split("|"),c=S.cart.find(x=>x.pid===+pid);if(+s>0)return addCart(pid);c.q--;if(!c.q)S.cart=S.cart.filter(x=>x!==c);render(true);return}
  if(d.pay){S.pay=d.pay;render(true);return}
  if(d.per){S.perTab=d.per;render(true);return}
  if(d.couv){S.couv=+d.couv;S.cmdQ={};render(true);return}
  if(d.send){envoyer(d.send);return}
  if(d.confirm){confirmer(d.confirm);return}
  if(d.recv){recevoir(d.recv);return}
  if(d.recok){valRecep(d.recok);return}
  if(d.pm){payer(d.pm);return}
  if(d.plan){payer(null,d.plan);return}
  if(d.bill){S.bill=d.bill;render(true);return}
  if(d.retire){const{p,l}=findLot(d.retire);S.pertes.push({p,n:l.n,q:l.q,v:l.q*p.pa});toast(`Lot ${l.n} retiré : ${l.q} × ${p.nom} mis en destruction (${fmt(l.q*p.pa)}).`);l.q=0;render(true);return}
  if(d.retour){const{p,l}=findLot(d.retour);S.avoirs.push({p,n:l.n,q:l.q,v:l.q*p.pa});toast(`Retour préparé : ${l.q} × ${p.nom} chez ${FOUR[p.f].n}. Avoir attendu : ${fmt(l.q*p.pa)}.`);l.q=0;render(true);return}
  if(d.prio){const{p,l}=findLot(d.prio);l.prio=!l.prio;render(true);toast(l.prio?`${p.nom} (lot ${l.n}) sera proposé en premier au comptoir.`:"Priorité retirée.");return}
  if(d.smode){S.scanMode=d.smode;document.querySelectorAll("[data-smode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.smode===S.scanMode));V_scanRes();return}
  if(d.sample){onCode(SAMPLES[+d.sample][1](),"exemple");return}
  const a=d.act;if(!a)return;
  if(a==="camon")return camOn();
  if(a==="camoff"){stopCam();document.getElementById("reader").innerHTML='<div class="ph">Caméra arrêtée.</div>';document.getElementById("camon").hidden=false;document.getElementById("camoff").hidden=true;return}
  if(a==="scanadd")return scanAdd();
  if(a==="scansell")return scanSell();
  if(a==="scannext"){S.cur=null;V_scanRes();resumeCam();return}
  if(a==="scanmanual"){S.cur={raw:"",kind:"Saisie manuelle",manual:true,gtin:"",lot:"",exp:"",serie:"",p:null};V_scanRes();return}
  if(a==="scanmode"){S.scanMode=d.m;document.querySelectorAll("[data-smode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.smode===S.scanMode));V_scanRes();return}
  if(a==="encaisser")return encaisser();
  if(a==="vider"){S.cart=[];render(true);return}
  if(a==="import")return toast("Envoyez votre fichier Excel ou l'export de votre ancien logiciel : on l'importe pour vous, gratuitement.");
  if(a==="feuille")return toast(`Feuille de comptage « ${S.invCat} » prête (démo).`);
  if(a==="toutok"){P.filter(p=>p.cat===S.invCat).forEach(p=>S.inv[p.id]=p.lots.reduce((s,l)=>s+l.q,0));render(true);return}
  if(a==="valinv")return valInv();
  if(a==="payer")return payer(null,null);
  if(a==="paye"){const x=plan(S.payPlan),an=S.bill==="an",amt=an?x.m*10:x.m;if(S.payPlan)S.plan=S.payPlan;S.payPlan=null;S.paidUntil=an?"30/11/2027":"31/12/2026";
    S.invoices.unshift([an?"Déc. 2026 – nov. 2027":"Décembre 2026",S.payM,"02/11/2026",amt]);closeLayer();render();toast(`Paiement de ${fmt(amt)} par ${S.payM} confirmé (démo). Formule ${x.n}. Reçu envoyé sur WhatsApp.`);return}
  if(a==="more")return more();
  if(a==="toticket"){document.getElementById("ticket").scrollIntoView({behavior:"smooth",block:"start"});return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLayer();if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.prod)fiche(e.target.dataset.prod);
  if(e.key==="Enter"&&e.target.id==="cq"){const q=S.q.trim().toLowerCase(),p=P.find(p=>(p.nom+" "+p.pres).toLowerCase().includes(q)&&stock(p));if(q&&p){addCart(p.id);S.q="";render(true);document.getElementById("cq").focus()}}});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="cq"){S.q=t.value;fillRes();return}
  if(t.id==="sq"){S.q=t.value;fillStock();return}
  if(t.dataset.cq){S.cmdQ[t.dataset.cq]=Math.max(0,parseInt(t.value)||0);return}
  if(t.dataset.inv){S.inv[t.dataset.inv]=t.value===""?null:Math.max(0,parseInt(t.value)||0);invTotals();return}
  if(t.id&&t.id.startsWith("re")){const o=S.orders.find(x=>x.id===(document.querySelector("[data-recok]")||{}).dataset?.recok);o&&rwarn(o)}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="role"||t.id==="mrole"){S.role=t.value;S.view=navItems()[0][0];render();toast(t.value==="vendeur"?"Vue vendeur : caisse, stock et péremptions. Pas d'accès aux prix d'achat ni aux commandes.":"Vue titulaire : accès complet.");return}
  if(t.dataset.cq){render(true);return}
  if(t.id==="scat"){S.fcat=t.value;fillStock();return}
  if(t.id==="sst"){S.fst=t.value;fillStock();return}
  if(t.id==="icat"){S.invCat=t.value;render(true);return}
  if(t.id==="scanfile"&&t.files[0]){scanPhoto(t.files[0]);t.value="";return}
  if(t.id==="sp"&&S.cur){S.cur.p=byId(t.value)||null;const lot=(document.getElementById("slot")||{}).value,exp=(document.getElementById("sexp")||{}).value;if(lot!=null){S.cur.lot=lot;S.cur.exp=exp}V_scanRes()}});
render();
</script>
